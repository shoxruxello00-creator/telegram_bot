services:
  postgres:
    image: postgres:16-alpine
    container_name: english_c2_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: english_c2_bot
      TZ: Asia/Tashkent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d english_c2_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: english_c2_quiz_bot
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@postgres:5432/english_c2_bot
      TIMEZONE: Asia/Tashkent

volumes:
  pgdata:
